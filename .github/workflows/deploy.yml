name: Deploy Production (Worker + Pages)

# One Pages project serves BOTH halves of prismfilehero.com:
#   /      the no-build marketing/tools site in ./site
#   /app   the built React application (vite base '/app/', assembled into ./deploy by
#          scripts/build-release.mjs, with a Pages Function providing the SPA fallback)
# Previously this workflow published only ./site, which is why /app was a 404 and the product UI
# existed nowhere in production.
#
# The Worker now ships in the same pipeline. Production used to be deployed by hand from a laptop,
# which is how the live Worker ended up months behind main: no /api/billing/*, no /api/paypal/webhook.
#
# Production deploys are ONLY allowed on an actual push to main (or a manual dispatch). A pull_request
# must never deploy to production: PRs run in the fork's/branch's context and would push unreviewed
# code to the live site. Verification of PRs belongs in the test/build workflow, not here.
#
# NOTE FOR THE FIRST RUN: this file turns "git push origin main" into a production deployment of
# both the Worker and Pages. Deploying it is the product owner's call (docs/PRODUCTION-CUTOVER-PLAN.md
# Phase 6.4) — and the Worker deploy newly makes ENVIRONMENT=production and the pinned Clerk issuer
# from wrangler.toml live, so the AI_PROXY_ENABLED kill switch and that issuer become the operational
# controls from that moment. This workflow must never override either.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deployments so two pushes to main cannot interleave a partial deploy.
concurrency:
  group: production-deploy-main
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Build and verify the artifact
    runs-on: ubuntu-latest
    # Defence in depth: refuse to run for any event that is not a push/dispatch on main.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (app and Worker)
        run: npm ci && npm ci --prefix worker

      - name: Require the production build secrets
        # Fail with the list of what is missing instead of a confusing vite error three steps later.
        env:
          CLERK_PK: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          POSTHOG: ${{ secrets.VITE_POSTHOG_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLERK_PK:-}" ]  || missing+=VITE_CLERK_PUBLISHABLE_KEY
          [ -n "${SB_URL:-}" ]    || missing+=VITE_SUPABASE_URL
          [ -n "${SB_ANON:-}" ]   || missing+=VITE_SUPABASE_ANON_KEY
          [ -n "${POSTHOG:-}" ]   || missing+=VITE_POSTHOG_KEY
          if [ ${#missing[@]} -gt 0 ]; then
            echo "These repository secrets are not set, and the build must not inherit them from"
            echo "anyone's laptop: ${missing[*]}"
            exit 1
          fi

      - name: Write the production build environment
        # Values arrive through env, never interpolated into the script text: a secret that contains
        # a quote or $( ) would otherwise be shell syntax.
        env:
          CLERK_PK: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          SB_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SB_ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          POSTHOG: ${{ secrets.VITE_POSTHOG_KEY }}
          WORKER_URL: https://prism-worker.prismfilehero.workers.dev
        run: |
          set -euo pipefail
          {
            printf 'VITE_CLERK_PUBLISHABLE_KEY=%s\n'  "$CLERK_PK"
            printf 'VITE_WORKER_URL=%s\n'             "$WORKER_URL"
            printf 'VITE_WORKER_BASE_URL=%s\n'        "$WORKER_URL"
            printf 'VITE_SUPABASE_URL=%s\n'           "$SB_URL"
            printf 'VITE_SUPABASE_ANON_KEY=%s\n'      "$SB_ANON"
            printf 'VITE_POSTHOG_KEY=%s\n'            "$POSTHOG"
            printf 'VITE_POSTHOG_HOST=%s\n'           'https://app.posthog.com'
          } > .env.production
          # A production bundle that binds to a dev machine is how /app came to be broken in anger.
          grep -q "VITE_WORKER_URL=${WORKER_URL}" .env.production
          ! grep -qE '127\.0\.0\.1|localhost' .env.production

      - name: Typecheck the app
        run: npx tsc --noEmit

      - name: Typecheck the Worker
        run: npm run typecheck --prefix worker

      # The measurement suite shells out to poppler, Ghostscript and ImageMagick to verify the bytes
      # these tools actually produce. Without them pdfimages/pdftotext/pdftoppm/gs/identify die with
      # ENOENT and ~40 output tests fail because of the runner, not the code.
      - name: Install measurement tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript imagemagick

      - name: Unit and integration tests
        run: npm test

      - name: Build the unified release artifact (site + /app + _worker.js)
        run: npm run release:build

      # A 200 that contains the marketing homepage is not an app deployment, so assert the artifact
      # actually holds both halves before anything reaches Cloudflare.
      - name: Verify the artifact structure
        run: |
          set -euo pipefail
          test -f deploy/index.html                       # marketing root
          test -f deploy/app/index.html                   # app document
          grep -q '/app/assets/' deploy/app/index.html    # assets are mounted under /app
          test -f deploy/_worker.js                       # router that serves /app deep links
          ls deploy/app/assets/index-*.js >/dev/null
          # The release must not be able to trust locally minted tokens: no stand-in issuer, no
          # local Worker port, no localtest environment anywhere in what gets published.
          ! grep -rIq -e '8799' -e 'localtest' -e '127\.0\.0\.1:878' -e 'localhost:878' deploy
          echo "artifact: $(find deploy -type f | wc -l) files, $(du -sh deploy | cut -f1)"

      # The real gate: boot the built bundle in a Pages runtime and assert what renders, against a
      # real Worker and a real Postgres. Nothing here is stubbed; the only substitution is that
      # requests to the deployed Worker origin are re-pointed at 127.0.0.1:8787.
      - name: Start the local database
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Boot the artifact against a real Worker and database
        run: |
          set -euo pipefail
          supabase start > /tmp/supabase-start.log 2>&1 || { cat /tmp/supabase-start.log; exit 1; }
          status=$(supabase status -o json)
          url=$(node -e "console.log(JSON.parse(process.argv[1]).api_url)" "$status")
          key=$(node -e "console.log(JSON.parse(process.argv[1]).service_role_key)" "$status")
          printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$url" "$key" > worker/.dev.vars
          (cd worker && nohup npx wrangler dev --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/api/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8787/api/health >/dev/null || { tail -40 /tmp/wrangler.log; exit 1; }
          # Only the headless shell: the full chromium asset redirects to
          # playwright.download.prss.microsoft.com, which failed DNS on this runner twice in a row.
          # check:release runs headless, so the shell is all it needs.
          npx playwright install --with-deps chromium-headless-shell
          npm run check:release
        env:
          PRISM_CHROMIUM_CHANNEL: chromium-headless-shell

      - uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy
          retention-days: 7

  deploy:
    name: Deploy Worker + Pages
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: deploy
          path: deploy

      - name: Deploy Cloudflare Worker (prism-worker)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      - name: Deploy unified artifact to Cloudflare Pages (prism-file-hero)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=prism-file-hero --branch=main --commit-dirty=false
