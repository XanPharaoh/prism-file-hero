name: CI / Build

on:
  push:
    branches: [main, develop]
    tags:     ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  PYTHON: "3.11"
  WIX:    "4.0.5"

jobs:

  # ── Unit tests — fast, no binary deps ──────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: pytest
        run: pytest tests/unit/ -v --cov=docsuitekit --cov-report=xml --tb=short

      - uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Full MSI build — only on version tags ──────────────────────────────────
  build-msi:
    name: Build MSI
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - name: Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller Pillow

      - name: Chocolatey — external binaries
        shell: pwsh
        run: |
          choco install ghostscript  --yes --no-progress
          choco install tesseract    --yes --no-progress
          choco install qpdf         --yes --no-progress
          choco install poppler      --yes --no-progress
          choco install libreoffice  --yes --no-progress

      - name: Refresh PATH
        shell: pwsh
        run: |
          $m = [Environment]::GetEnvironmentVariable("PATH","Machine")
          $u = [Environment]::GetEnvironmentVariable("PATH","User")
          echo "PATH=$m;$u" >> $env:GITHUB_ENV

      - name: Install WiX ${{ env.WIX }}
        shell: pwsh
        run: |
          dotnet tool install --global wix --version ${{ env.WIX }}
          wix extension add WixToolset.UI.wixext/${{ env.WIX }}
          wix extension add WixToolset.Util.wixext/${{ env.WIX }}

      - name: Generate installer assets
        run: python packaging/create_assets.py

      - name: Download models
        run: python packaging/post_install_models.py --skip-ollama
        env:
          DOCSUITEKIT_MODELS_DIR: ${{ runner.temp }}\models

      - name: Build
        run: python packaging/build_msi.py
        env:
          DOCSUITEKIT_MODELS_DIR: ${{ runner.temp }}\models

      - name: Verify
        run: python packaging/verify_build.py

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          echo "V=$v" >> $env:GITHUB_OUTPUT

      - name: Stage release files
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.V }}"
          Rename-Item dist\DocSuiteKit-Setup.msi       "DocSuiteKit-$v-Setup.msi"
          Rename-Item dist\DocSuiteKit-Setup.msi.sha256 "DocSuiteKit-$v-Setup.msi.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: DocSuiteKit-${{ steps.ver.outputs.V }}-msi
          path: dist/DocSuiteKit-*
          retention-days: 30

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocSuiteKit-${{ steps.ver.outputs.V }}-Setup.msi
            dist/DocSuiteKit-${{ steps.ver.outputs.V }}-Setup.msi.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
