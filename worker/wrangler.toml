name = "prism-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Comma-separated exact browser origins. Add staging origins explicitly; do not use private-network ranges.
# Trusted Cloudflare Pages preview host suffixes; only one HTTPS subdomain label is accepted.
ALLOWED_ORIGIN_SUFFIXES = "prism-file-hero.pages.dev"
ALLOWED_ORIGINS = "https://prismfilehero.com,https://www.prismfilehero.com,https://prismfilehero.free.nf,https://app.prismfilehero.free.nf,https://prism-file-hero.pages.dev,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:4173,https://localhost,http://tauri.localhost,tauri://localhost"
SUPABASE_URL = "https://vejdrvnymmowvjxleefm.supabase.co"
CLERK_JWKS_URL = "https://clerk.prismfilehero.com/.well-known/jwks.json"
# Issuer defaults to the JWKS URL origin. Set audience only for Clerk JWT templates that emit aud.
# CLERK_JWT_ISSUER = "https://innocent-manatee-90.clerk.accounts.dev"
# CLERK_JWT_AUDIENCE = "<your Clerk JWT template audience>"
# INTERNAL_MAX_ACTIVE_DEVICES = "10"

# SECURITY: Secrets must NOT be in this file — use: cd worker && npx wrangler secret put <KEY_NAME>
# Required secrets:
#   wrangler secret put NVIDIA_API_KEY
#   wrangler secret put GROQ_API_KEY_1
#   wrangler secret put GROQ_API_KEY_2
#   wrangler secret put MISTRAL_API_KEY_1
#   wrangler secret put MISTRAL_API_KEY_2
#   wrangler secret put MISTRAL_API_KEY_3
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put INTERNAL_ACTIVATION_CODE
#   wrangler secret put PADDLE_WEBHOOK_SECRET      # Paddle webhook signature secret (sandbox or prod)
# Billing (Batch 05): the Worker POST /api/paddle/webhook verifies the raw-body signature with
# PADDLE_WEBHOOK_SECRET and persists via the apply_billing_event RPC (event_id PK = dedupe that
# survives restarts). Point Paddle's webhook URL at https://<worker>/api/paddle/webhook.
# Optional non-secret vars: INTERNAL_DEVICE_TOKEN_TTL_DAYS = "90", INTERNAL_MAX_ACTIVE_DEVICES = "10"
# KV must be bound as KV; see docs-internal-desktop.md before deployment.

[[kv_namespaces]]
binding = "KV"
id = "4b7542976fcb4b97ba52b08d6f92f73c"

[triggers]
crons = ["0 */6 * * *"]

# `--env localtest` exists only so the HTTP route tests (scripts/worker-routes-check.mjs,
# checkout-return-check.mjs, paid-tool-output-check.mjs) can authenticate as synthetic users. Those
# tests mint their own RS256 tokens against scripts/local-jwks.mjs on :8799, which is a stand-in for
# Clerk and must never be what a real deployment trusts. The default environment verifies genuine
# Clerk signatures instead.
[env.localtest.vars]
CLERK_JWKS_URL = "http://127.0.0.1:8799/.well-known/jwks.json"
CLERK_JWT_ISSUER = "http://127.0.0.1:8799"

# ── Staging: isolated, sandbox, genuine Clerk ──────────────────────────────────────────────
# `--env staging` is the pre-production target. It never inherits the production bindings: the
# default [vars] above point at the live Supabase project and the live Clerk domain, and an env
# only overrides what it restates, so every one of those is redeclared here. Deploying this env
# before the two resources below exist is inert by design — the Worker cannot read a plan or write
# a ledger row against a placeholder origin, and every billing route fails closed.
#
# Prerequisites (docs/staging-runbook.md, steps 1–3): a separate Supabase project with the
# committed migrations applied, a separate KV namespace, and the per-env secrets. PayPal stays in
# sandbox; paid AI providers are deliberately not configured, so /api/ai answers 502 and no
# provider spend is possible from staging.
[env.staging]
name = "prism-worker-staging"
workers_dev = true          # *.workers.dev only — no custom domain, never prismfilehero.com

[env.staging.vars]
# Clerk DEVELOPMENT instance: genuine tokens, genuine signatures, zero production accounts.
CLERK_JWKS_URL = "https://innocent-manatee-90.clerk.accounts.dev/.well-known/jwks.json"
CLERK_JWT_ISSUER = "https://innocent-manatee-90.clerk.accounts.dev"
# Set by `supabase projects create` / the dashboard — see the runbook. Left unset on purpose so a
# half-configured deploy cannot silently reach the production database.
# SUPABASE_URL = "https://<staging-project-ref>.supabase.co"
ALLOWED_ORIGINS = "https://prism-file-hero-staging.pages.dev"
ALLOWED_ORIGIN_SUFFIXES = "prism-file-hero-staging.pages.dev"
FRONTEND_URL = "https://prism-file-hero-staging.pages.dev"
PAYPAL_ENV = "sandbox"
ENVIRONMENT = "staging"

# Created 2026-10-14 with `wrangler kv namespace create STAGING_KV` (title STAGING_KV,
# id 638dafd65847402c8271625f9182d582). Bound as `KV` so the code is unchanged, but the
# namespace itself is separate: production device tokens are unreachable from staging.
[[env.staging.kv_namespaces]]
binding = "KV"
id = "638dafd65847402c8271625f9182d582"
